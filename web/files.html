<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UFID Known Files</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <img src="/assets/ufid-mark.svg" alt="" width="32" height="32">
        <div>
          <h1>UFID</h1>
          <p>Universal File Identity Database</p>
        </div>
      </div>
      <nav class="primary-nav" aria-label="Primary">
        <a class="nav-link" href="/">Search</a>
        <a class="nav-link active" href="/files.html">Known Files</a>
        <a class="nav-link" href="/goldrush.html">Goldrush</a>
      </nav>
      <div id="apiStatus" class="status">Checking API</div>
      <form id="loginForm" class="auth-form">
        <input id="loginUsername" type="text" autocomplete="username" placeholder="Username">
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password">
        <button id="loginButton" type="submit">Log in</button>
      </form>
      <div id="sessionPanel" class="session-panel" hidden>
        <span id="sessionUser"></span>
        <button id="logoutButton" class="secondary-button" type="button">Log out</button>
      </div>
    </header>

    <main class="files-workspace">
      <section class="panel files-panel" aria-labelledby="filesTitle">
        <div class="panel-heading files-heading">
          <div>
            <h2 id="filesTitle">Known Files</h2>
            <div id="listState" class="status quiet">Idle</div>
          </div>
          <div class="files-toolbar">
            <label>
              Filter
              <input id="fileFilter" type="search" placeholder="UFID, name, size, hash">
            </label>
            <button id="refreshButton" type="button">Refresh</button>
          </div>
        </div>

        <div class="files-table-shell">
          <table class="files-table">
            <thead>
              <tr>
                <th aria-sort="descending"><button class="sort-button" type="button" data-sort="id">UFID<span class="sort-indicator" aria-hidden="true"> v</span></button></th>
                <th><button class="sort-button" type="button" data-sort="name">Name<span class="sort-indicator" aria-hidden="true"></span></button></th>
                <th><button class="sort-button" type="button" data-sort="size">Size<span class="sort-indicator" aria-hidden="true"></span></button></th>
                <th><button class="sort-button" type="button" data-sort="crc32">CRC32<span class="sort-indicator" aria-hidden="true"></span></button></th>
                <th><button class="sort-button" type="button" data-sort="md5">MD5<span class="sort-indicator" aria-hidden="true"></span></button></th>
                <th><button class="sort-button" type="button" data-sort="sha1">SHA1<span class="sort-indicator" aria-hidden="true"></span></button></th>
                <th><button class="sort-button" type="button" data-sort="sha256">SHA256<span class="sort-indicator" aria-hidden="true"></span></button></th>
                <th><button class="sort-button" type="button" data-sort="blake3">BLAKE3<span class="sort-indicator" aria-hidden="true"></span></button></th>
              </tr>
            </thead>
            <tbody id="filesTable">
              <tr>
                <td colspan="8">No records loaded.</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="files-footer">
          <div id="pageSummary" class="page-summary">No records loaded.</div>
          <div class="pagination-controls" aria-label="Known files pages">
            <button id="previousPageButton" class="secondary-button page-nav-button" type="button" disabled>Previous</button>
            <div id="pageNumberList" class="page-number-list" aria-label="Pages"></div>
            <button id="nextPageButton" class="secondary-button page-nav-button" type="button" disabled>Next</button>
            <span id="pageInfo" class="page-info">Page 1 of 1</span>
          </div>
        </div>
      </section>
    </main>

    <script src="/files.js" type="module"></script>
  </body>
</html>
