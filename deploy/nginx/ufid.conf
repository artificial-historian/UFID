upstream ufid_api {
    server 127.0.0.1:8765;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ufid.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ufid.example.com;

    ssl_certificate /etc/letsencrypt/live/ufid.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ufid.example.com/privkey.pem;

    root /opt/ufid/web;
    index index.html;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    location /api/ {
        # UFID has API login/roles. You can still add nginx basic auth here for
        # an extra perimeter layer if desired.
        # auth_basic "UFID";
        # auth_basic_user_file /etc/nginx/ufid.htpasswd;

        proxy_pass http://ufid_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /health {
        proxy_pass http://ufid_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
