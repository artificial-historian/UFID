openapi: 3.1.0
info:
  title: UFID API
  version: 0.8
servers:
  - url: https://ufid.example.com
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: API is reachable
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
  /api/v1/files/by-hash:
    get:
      summary: Search files by hash
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: algorithm
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/HashAlgorithm"
        - name: value
          in: query
          required: true
          schema:
            type: string
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Search result
          content:
            application/json:
              schema:
                type: object
                required: [found]
                properties:
                  found:
                    type: boolean
                  count:
                    type: integer
                  file:
                    $ref: "#/components/schemas/FileRecord"
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileRecord"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/files:
    get:
      summary: Browse or search file records
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: sort
          in: query
          schema:
            type: string
            enum: [id, name, size, crc32, md5, sha1, sha256, blake3]
            default: id
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: File page
          content:
            application/json:
              schema:
                type: object
                required: [files, limit, offset, count]
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileRecord"
                  limit:
                    type: integer
                  offset:
                    type: integer
                  count:
                    type: integer
                  total_count:
                    type: integer
                  sort:
                    type: string
                  direction:
                    type: string
                  next_offset:
                    type:
                      - integer
                      - "null"
    post:
      summary: Add or enrich a file identity
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileUpsert"
      responses:
        "200":
          $ref: "#/components/responses/UpsertResult"
        "201":
          $ref: "#/components/responses/UpsertResult"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          description: Identity conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictError"
  /api/v1/goldrush/alerts:
    get:
      summary: Browse the current user's Goldrush alert entries
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Goldrush alert page
          content:
            application/json:
              schema:
                type: object
                required: [alerts, limit, offset, count, total_count]
                properties:
                  alerts:
                    type: array
                    items:
                      $ref: "#/components/schemas/GoldrushAlert"
                  limit:
                    type: integer
                  offset:
                    type: integer
                  count:
                    type: integer
                  total_count:
                    type: integer
                  next_offset:
                    type:
                      - integer
                      - "null"
    post:
      summary: Create a Goldrush alert entry for the current user
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/GoldrushAlertInput"
                - $ref: "#/components/schemas/GoldrushAlertClearRequest"
      responses:
        "200":
          description: Alert already existed or alerts erased
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GoldrushAlertResult"
                  - $ref: "#/components/schemas/GoldrushAlertClearResult"
        "201":
          description: Alert created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldrushAlertResult"
        "400":
          $ref: "#/components/responses/Error"
    delete:
      summary: Erase the current user's Goldrush alert entries
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Goldrush alerts erased
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldrushAlertClearResult"
  /api/v1/goldrush/import-dat:
    post:
      summary: Import Logiqx DAT entries into the current user's Goldrush alerts
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoldrushImportRequest"
      responses:
        "200":
          description: DAT imported with no newly created alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldrushImportResult"
        "201":
          description: DAT imported with newly created alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldrushImportResult"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/goldrush/alerts/clear:
    post:
      summary: Erase the current user's Goldrush alert entries
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Goldrush alerts erased
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldrushAlertClearResult"
  /api/v1/goldrush/alert-sources:
    get:
      summary: List the current user's Goldrush alert sources for match filtering
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Goldrush alert source list
          content:
            application/json:
              schema:
                type: object
                required: [sources, count]
                properties:
                  sources:
                    type: array
                    items:
                      $ref: "#/components/schemas/GoldrushAlertSource"
                  count:
                    type: integer
  /api/v1/goldrush/matches:
    get:
      summary: List stored UFID matches for the current user's Goldrush alerts
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: source_key
          in: query
          description: Repeat to restrict matches to one or more alert sources.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Goldrush match page
          content:
            application/json:
              schema:
                type: object
                required: [matches, limit, offset, count, total_count]
                properties:
                  matches:
                    type: array
                    items:
                      $ref: "#/components/schemas/GoldrushMatch"
                  limit:
                    type: integer
                  offset:
                    type: integer
                  count:
                    type: integer
                  total_count:
                    type: integer
                  next_offset:
                    type:
                      - integer
                      - "null"
  /api/v1/goldrush/matches/search:
    post:
      summary: Search and store matches for the current user's Goldrush alerts
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Goldrush match search result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldrushMatchSearchResult"
  /api/v1/files/{file_id}:
    get:
      summary: Load one file record
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: file_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: File record
          content:
            application/json:
              schema:
                type: object
                required: [file]
                properties:
                  file:
                    $ref: "#/components/schemas/FileRecord"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/files/{file_id}/metadata:
    post:
      summary: Add metadata to an existing file
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: file_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata:
                  oneOf:
                    - type: object
                      additionalProperties:
                        type: string
                    - type: array
                      items:
                        $ref: "#/components/schemas/MetadataInput"
      responses:
        "200":
          description: Metadata result
          content:
            application/json:
              schema:
                type: object
                required: [enriched]
                properties:
                  enriched:
                    type: boolean
  /api/v1/archive-members:
    post:
      summary: Add an archive parent-child relationship
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parent_file_id]
              properties:
                parent_file_id:
                  type: integer
                  minimum: 1
                child_file_id:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                archive_path:
                  type:
                    - string
                    - "null"
      responses:
        "200":
          $ref: "#/components/responses/CreatedFlag"
        "201":
          $ref: "#/components/responses/CreatedFlag"
  /api/v1/auth/login:
    post:
      summary: Log in and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login result
          content:
            application/json:
              schema:
                type: object
                required: [authenticated, token, token_type, user]
                properties:
                  authenticated:
                    type: boolean
                  token:
                    type: string
                  token_type:
                    type: string
                    enum: [Bearer]
                  expires_at:
                    type: string
                  user:
                    $ref: "#/components/schemas/AuthUser"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/auth/session:
    get:
      summary: Inspect current session
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                type: object
                required: [authenticated]
                properties:
                  authenticated:
                    type: boolean
                  user:
                    $ref: "#/components/schemas/AuthUser"
  /api/v1/auth/logout:
    post:
      summary: Revoke current session
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Logout result
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: boolean
  /api/v1/auth/users:
    get:
      summary: List users
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: object
                required: [users, count]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuthUser"
                  count:
                    type: integer
    post:
      summary: Create a user or invitation link
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, roles]
              properties:
                username:
                  type: string
                password:
                  type: string
                  description: When omitted, an invitation link is generated.
                display_name:
                  type:
                    - string
                    - "null"
                roles:
                  type: array
                  items:
                    type: string
                    enum: [reader, contributor, curator, admin]
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                  registration:
                    $ref: "#/components/schemas/RegistrationLink"
  /api/v1/auth/register:
    post:
      summary: Register a user pending admin activation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                display_name:
                  type:
                    - string
                    - "null"
      responses:
        "201":
          description: Registered user
          content:
            application/json:
              schema:
                type: object
                required: [registered, requires_activation, user]
                properties:
                  registered:
                    type: boolean
                  requires_activation:
                    type: boolean
                  user:
                    $ref: "#/components/schemas/AuthUser"
  /api/v1/auth/registration/validate:
    get:
      summary: Validate a registration link token
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Registration link
          content:
            application/json:
              schema:
                type: object
                required: [registration]
                properties:
                  registration:
                    $ref: "#/components/schemas/RegistrationLink"
  /api/v1/auth/registration/complete:
    post:
      summary: Complete invited registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                display_name:
                  type:
                    - string
                    - "null"
      responses:
        "200":
          description: Completed registration and created session
          content:
            application/json:
              schema:
                type: object
                required: [completed, authenticated, token, token_type, user]
                properties:
                  completed:
                    type: boolean
                  authenticated:
                    type: boolean
                  token:
                    type: string
                  token_type:
                    type: string
                    enum: [Bearer]
                  expires_at:
                    type: string
                  user:
                    $ref: "#/components/schemas/AuthUser"
  /api/v1/auth/me:
    get:
      summary: Load current user profile
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                  removal_request:
                    $ref: "#/components/schemas/RemovalRequest"
  /api/v1/auth/me/password:
    post:
      summary: Change current user password
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                required: [changed]
                properties:
                  changed:
                    type: boolean
  /api/v1/auth/me/removal-request:
    post:
      summary: Request current user removal
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "201":
          description: Removal request
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties:
                  request:
                    $ref: "#/components/schemas/RemovalRequest"
  /api/v1/auth/users/{user_id}/activate:
    post:
      summary: Activate a user
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          $ref: "#/components/responses/UserResult"
  /api/v1/auth/users/{user_id}/deactivate:
    post:
      summary: Deactivate a user
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          $ref: "#/components/responses/UserResult"
  /api/v1/auth/users/{user_id}/roles:
    post:
      summary: Replace a user's roles
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  items:
                    type: string
                    enum: [reader, contributor, curator, admin]
      responses:
        "200":
          $ref: "#/components/responses/UserResult"
  /api/v1/auth/users/{user_id}/invite:
    post:
      summary: Generate a registration link for a user
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Registration link
          content:
            application/json:
              schema:
                type: object
                required: [registration]
                properties:
                  registration:
                    $ref: "#/components/schemas/RegistrationLink"
  /api/v1/auth/users/{user_id}:
    delete:
      summary: Delete a user
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted, user_id]
                properties:
                  deleted:
                    type: boolean
                  user_id:
                    type: integer
  /api/v1/auth/removal-requests:
    get:
      summary: List user removal requests
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, blocked]
            default: pending
      responses:
        "200":
          description: Removal request list
          content:
            application/json:
              schema:
                type: object
                required: [requests, count]
                properties:
                  requests:
                    type: array
                    items:
                      $ref: "#/components/schemas/RemovalRequest"
                  count:
                    type: integer
  /api/v1/auth/removal-requests/{request_id}/approve:
    post:
      summary: Approve user removal
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          $ref: "#/components/responses/RemovalRequestResult"
  /api/v1/auth/removal-requests/{request_id}/block:
    post:
      summary: Block user removal
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          $ref: "#/components/responses/RemovalRequestResult"
components:
  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    RequestId:
      name: request_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: ufid_session
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UpsertResult:
      description: Upsert result
      content:
        application/json:
          schema:
            type: object
            required: [id, created, enriched]
            properties:
              id:
                type: integer
              created:
                type: boolean
              enriched:
                type: boolean
    CreatedFlag:
      description: Created or already existed
      content:
        application/json:
          schema:
            type: object
            required: [created]
            properties:
              created:
                type: boolean
    UserResult:
      description: User result
      content:
        application/json:
          schema:
            type: object
            required: [user]
            properties:
              user:
                $ref: "#/components/schemas/AuthUser"
    RemovalRequestResult:
      description: Removal request result
      content:
        application/json:
          schema:
            type: object
            required: [request]
            properties:
              request:
                $ref: "#/components/schemas/RemovalRequest"
  schemas:
    HashAlgorithm:
      type: string
      enum: [crc32, md5, sha1, sha256, blake3]
    MetadataType:
      type: string
      enum: [text, image, url, json, number, date, binary, other]
    HashSet:
      type: object
      required: [crc32, md5, sha1]
      properties:
        crc32:
          type: string
          pattern: "^[0-9a-fA-F]{8}$"
        md5:
          type: string
          pattern: "^[0-9a-fA-F]{32}$"
        sha1:
          type: string
          pattern: "^[0-9a-fA-F]{40}$"
        sha256:
          type:
            - string
            - "null"
          pattern: "^[0-9a-fA-F]{64}$"
        blake3:
          type:
            - string
            - "null"
          pattern: "^[0-9a-fA-F]{64}$"
    PartialHashSet:
      type: object
      minProperties: 1
      properties:
        crc32:
          type:
            - string
            - "null"
          pattern: "^[0-9a-fA-F]{8}$"
        md5:
          type:
            - string
            - "null"
          pattern: "^[0-9a-fA-F]{32}$"
        sha1:
          type:
            - string
            - "null"
          pattern: "^[0-9a-fA-F]{40}$"
        sha256:
          type:
            - string
            - "null"
          pattern: "^[0-9a-fA-F]{64}$"
        blake3:
          type:
            - string
            - "null"
          pattern: "^[0-9a-fA-F]{64}$"
    GoldrushAlertInput:
      type: object
      required: [name, description, hashes]
      properties:
        name:
          type: string
        description:
          type: string
        size_bytes:
          type:
            - integer
            - "null"
          minimum: 0
        hashes:
          $ref: "#/components/schemas/PartialHashSet"
        source_type:
          type:
            - string
            - "null"
        source_name:
          type:
            - string
            - "null"
        source_detail:
          type:
            - string
            - "null"
    GoldrushAlert:
      allOf:
        - $ref: "#/components/schemas/GoldrushAlertInput"
        - type: object
          required: [id, created_at]
          properties:
            id:
              type: integer
            created_at:
              type: string
    GoldrushAlertResult:
      type: object
      required: [alert, created]
      properties:
        alert:
          $ref: "#/components/schemas/GoldrushAlert"
        created:
          type: boolean
          description: True when the alert was newly added to the current user's set.
    GoldrushAlertClearRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [clear]
    GoldrushAlertClearResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer
          description: Number of alerts removed from the current user's set.
    GoldrushAlertSource:
      type: object
      required: [source_key, label, alert_count]
      properties:
        source_key:
          type: string
          description: Use `manual` for manual alerts; imported sources use `source_type|source_name`.
        label:
          type: string
        source_type:
          type:
            - string
            - "null"
        source_name:
          type:
            - string
            - "null"
        alert_count:
          type: integer
    GoldrushImportRequest:
      type: object
      required: [text]
      properties:
        filename:
          type:
            - string
            - "null"
        text:
          type: string
    GoldrushImportResult:
      type: object
      required: [source_name, parsed, received, valid, created, skipped, errors]
      properties:
        source_name:
          type: string
        parsed:
          type: integer
        received:
          type: integer
        valid:
          type: integer
        created:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              name:
                type: string
              error:
                type: string
    GoldrushMatch:
      type: object
      required: [alert, file, matched_algorithms, size_matched]
      properties:
        alert:
          $ref: "#/components/schemas/GoldrushAlert"
        file:
          type: object
          required: [id, size_bytes, hashes]
          properties:
            id:
              type: integer
            size_bytes:
              type: integer
            display_name:
              type:
                - string
                - "null"
            content_type:
              type:
                - string
                - "null"
            hashes:
              $ref: "#/components/schemas/HashSet"
            internet_archive:
              type:
                - object
                - "null"
              properties:
                source_file_id:
                  type:
                    - integer
                    - "null"
                identifier:
                  type:
                    - string
                    - "null"
                item_url:
                  type:
                    - string
                    - "null"
                file_url:
                  type:
                    - string
                    - "null"
                file_name:
                  type:
                    - string
                    - "null"
        matched_algorithms:
          type: array
          items:
            $ref: "#/components/schemas/HashAlgorithm"
        size_matched:
          type: boolean
        found_at:
          type:
            - string
            - "null"
    GoldrushMatchSearchResult:
      type: object
      required: [search, total_count]
      properties:
        search:
          type: object
          required: [matched, created]
          properties:
            matched:
              type: integer
            created:
              type: integer
        total_count:
          type: integer
    FileUpsert:
      type: object
      required: [size_bytes, hashes]
      properties:
        display_name:
          type:
            - string
            - "null"
        size_bytes:
          type: integer
          minimum: 0
        description:
          type:
            - string
            - "null"
        content_type:
          type:
            - string
            - "null"
        hashes:
          $ref: "#/components/schemas/HashSet"
        metadata:
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: array
              items:
                $ref: "#/components/schemas/MetadataInput"
    FileRecord:
      allOf:
        - type: object
          required: [id, size_bytes, crc32, md5, sha1, hashes, metadata, archive_members, identity_conflicts]
          properties:
            id:
              type: integer
            size_bytes:
              type: integer
            crc32:
              type: string
            md5:
              type: string
            sha1:
              type: string
            sha256:
              type:
                - string
                - "null"
            blake3:
              type:
                - string
                - "null"
            display_name:
              type:
                - string
                - "null"
            description:
              type:
                - string
                - "null"
            content_type:
              type:
                - string
                - "null"
            hashes:
              $ref: "#/components/schemas/HashSet"
            metadata:
              type: array
              items:
                $ref: "#/components/schemas/MetadataRecord"
            archive_members:
              type: array
              items:
                $ref: "#/components/schemas/ArchiveMember"
            identity_conflicts:
              type: array
              items:
                $ref: "#/components/schemas/IdentityConflict"
    MetadataInput:
      type: object
      required: [metadata_type, name, value]
      properties:
        metadata_type:
          $ref: "#/components/schemas/MetadataType"
        name:
          type: string
        value:
          type: string
        notes:
          type:
            - string
            - "null"
    MetadataRecord:
      allOf:
        - $ref: "#/components/schemas/MetadataInput"
        - type: object
          required: [id, file_id, added_at]
          properties:
            id:
              type: integer
            file_id:
              type: integer
            added_at:
              type: string
    ArchiveMember:
      type: object
      required: [id, parent_file_id, child_file_id, archive_path]
      properties:
        id:
          type: integer
        parent_file_id:
          type: integer
        child_file_id:
          type:
            - integer
            - "null"
        archive_path:
          type:
            - string
            - "null"
    IdentityConflict:
      type: object
      required: [id, file_id, conflict_type, algorithm, incoming_value, incoming_size_bytes, incoming_crc32, incoming_md5, incoming_sha1, logged_at]
      properties:
        id:
          type: integer
        file_id:
          type: integer
        related_file_id:
          type:
            - integer
            - "null"
        conflict_type:
          type: string
          enum: [optional_hash_mismatch, required_hash_overlap]
        algorithm:
          $ref: "#/components/schemas/HashAlgorithm"
        existing_value:
          type:
            - string
            - "null"
        incoming_value:
          type: string
        incoming_size_bytes:
          type: integer
        incoming_crc32:
          type: string
        incoming_md5:
          type: string
        incoming_sha1:
          type: string
        notes:
          type:
            - string
            - "null"
        logged_at:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ConflictError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            file_id:
              type: integer
            conflict_type:
              type: string
              enum: [optional_hash_mismatch, required_hash_overlap]
    RegistrationLink:
      type: object
      required: [id, user_id, purpose, created_at, expires_at]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        purpose:
          type: string
          enum: [registration_completion]
        created_at:
          type: string
        expires_at:
          type: string
        used_at:
          type:
            - string
            - "null"
        token:
          type: string
        completion_url:
          type: string
        user:
          $ref: "#/components/schemas/AuthUser"
    RemovalRequest:
      type: object
      required: [id, user_id, status, requested_at]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        status:
          type: string
          enum: [pending, approved, blocked]
        requested_at:
          type: string
        decided_at:
          type:
            - string
            - "null"
        decided_by_user_id:
          type:
            - integer
            - "null"
        notes:
          type:
            - string
            - "null"
        deleted_user_id:
