        created_at:
          type:
            - string
            - "null"
        activated_at:
          type:
            - string
            - "null"
        registration_completed_at:
          type:
            - string
            - "null"
        disabled_at:
          type:
            - string
            - "null"
        session_id:
          type:
            - integer
            - "null"
        expires_at:
          type:
            - string
            - "null"
